; =============================================================================
;  OrbitStreet — Nodo en tierra (Ground Truth Node)
;  Firmware ESP32 con dashboard web embebido, multi-sensor y telemetria
; =============================================================================
;
;  CÓMO ELEGIR LA PLACA OBJETIVO
;  En VS Code (extensión PlatformIO):
;    Barra de estado inferior → clic en el nombre del env → seleccionar.
;
;  Por terminal:
;    pio run -e esp32dev                        ; solo compilar ESP32 dev
;    pio run -e esp32dev -t upload              ; compilar + subir
;    pio run -e esp32dev -t uploadfs            ; subir LittleFS (dashboard)
;    pio run -e esp32dev -t monitor             ; monitor serie 115200
;
;  IMPORTANTE: tras flashear el firmware, ejecutar TAMBIÉN -t uploadfs
;  para subir el dashboard HTML a la partición LittleFS del ESP32.
; =============================================================================

[platformio]
default_envs = esp32dev

; =============================================================================
;  [env] — BASE COMPARTIDA (todas las secciones [env:xxx] heredan esto)
; =============================================================================
[env]
platform         = espressif32
framework        = arduino
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder, time
lib_ldf_mode     = deep+
board_build.filesystem = littlefs
build_flags      =
    -D CONFIG_ARDUHAL_LOG_COLORS=0
    -Wno-unused-function
    -D ORBITSTREET_VERSION=\"0.1.0\"
lib_deps         =
    bblanchon/ArduinoJson@^7.4.3
    mathieucarbou/ESPAsyncWebServer@^3.6.0
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/DHT sensor library@^1.4.6

; =============================================================================
;  ESP32 Dev Module (WROOM-32 / ESP32-D0WD)
;  Puerto:  COM4  (ajustar según el puerto USB del PC)
;  I2C:     SDA=GPIO21 / SCL=GPIO22  (BME280, BMP280)
;  GPIO:    Cualquier pin digital para DHT11/DHT22
; =============================================================================
[env:esp32dev]
board       = esp32dev
upload_port = COM4
build_flags =
    ${env.build_flags}

; =============================================================================
;  ESP32-C3 Dev Kit M-1 (Super Mini)
;  Puerto:  COM31  (CDC USB nativo)
;  I2C:     SDA=GPIO4 / SCL=GPIO5
; =============================================================================
[env:esp32-c3-devkitm-1]
board       = esp32-c3-devkitm-1
upload_port = COM31
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
