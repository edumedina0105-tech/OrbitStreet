<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrbitStreet — Nodo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#07090E;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{font-size:1.1rem;padding:1rem;color:#22d3ee}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;width:min(400px,95vw);padding:0 .8rem 1rem}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:.75rem;padding:.8rem;text-align:center}
.card .val{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums;color:#22d3ee}
.card .unit{font-size:.7rem;color:#64748b}
.card .lbl{font-size:.7rem;color:#94a3b8;margin-bottom:.3rem}
.status{font-size:.75rem;padding:.5rem .8rem;color:#94a3b8;width:min(400px,95vw);text-align:center}
.ok{color:#34d399}.warn{color:#fbbf24}.err{color:#f87171}
#setup{display:none;width:min(400px,95vw);padding:.8rem}
#setup.show{display:block}
input,select,button{width:100%;margin:.3rem 0;padding:.6rem;border:1px solid #334155;border-radius:.5rem;background:#0f172a;color:#e2e8f0;font-size:.9rem}
button{background:#06b6d4;color:#0f172a;font-weight:700;border:none;cursor:pointer;margin-top:.6rem}
label{font-size:.75rem;color:#94a3b8;display:block;margin-top:.5rem}
</style>
</head>
<body>
<h1>🛰️ OrbitStreet — Nodo en tierra</h1>
<div id="status" class="status">Conectando...</div>
<div id="setup">
<label>Red WiFi (SSID)</label><input id="wifi_ssid" placeholder="MiRed">
<label>Contraseña WiFi</label><input id="wifi_pass" type="password" placeholder="••••••••">
<label>Sensor</label>
<select id="sensor_type">
<option value="none">Ninguno (solo baseline NASA)</option>
<option value="bme280">BME280 (I²C: SDA=21, SCL=22)</option>
<option value="dht11">DHT11 (GPIO digital)</option>
<option value="dht22">DHT22 / AM2302 (GPIO digital)</option>
</select>
<label>Pin GPIO del sensor (DHT/B3950)</label>
<input id="sensor_pin" type="number" value="4" placeholder="4">
<label>Latitud (ej: -25.26)</label><input id="lat" type="number" step="0.01" value="-25.26">
<label>Longitud (ej: -57.53)</label><input id="lon" type="number" step="0.01" value="-57.53">
<label>Intervalo de lectura (segundos)</label><input id="read_s" type="number" value="30">
<button onclick="saveConfig()">Guardar y conectar</button>
</div>
<div id="grid" class="grid">
<div class="card"><div class="lbl">🌡️ Temperatura</div><div class="val" id="t">—</div><div class="unit">°C</div></div>
<div class="card"><div class="lbl">💧 Humedad</div><div class="val" id="h">—</div><div class="unit">%</div></div>
<div class="card"><div class="lbl">📊 Presión</div><div class="val" id="p">—</div><div class="unit">hPa</div></div>
</div>
<div id="info" class="status"></div>
<script>
async function poll(){
try{
const r=await fetch('/api/data');const d=await r.json();
document.getElementById('t').textContent=d.hasData?d.temperature.toFixed(1):'—';
document.getElementById('h').textContent=d.hasData?d.humidity.toFixed(0):'—';
document.getElementById('p').textContent=d.hasData?d.pressure.toFixed(0):'—';
const s=document.getElementById('status');
s.textContent=d.connected?'✅ Conectado · '+d.ip:'📡 AP activo · 192.168.4.1';
s.className='status '+(d.connected?'ok':'warn');
document.getElementById('info').textContent=d.sensorType+' · lat '+d.latitude+'°';
if(!d.configured){document.getElementById('setup').classList.add('show');document.getElementById('grid').style.display='none';}
else{document.getElementById('setup').classList.remove('show');document.getElementById('grid').style.display='grid';}
}catch(e){document.getElementById('status').textContent='⚠️ Nodo no accesible';}
}
async function saveConfig(){
const body=JSON.stringify({
wifi_ssid:document.getElementById('wifi_ssid').value,
wifi_pass:document.getElementById('wifi_pass').value,
sensor_type:document.getElementById('sensor_type').value,
sensor_pin:parseInt(document.getElementById('sensor_pin').value)||4,
latitude:parseFloat(document.getElementById('lat').value)||0,
longitude:parseFloat(document.getElementById('lon').value)||0,
read_interval_s:parseInt(document.getElementById('read_s').value)||30
});
const r=await fetch('/api/config',{method:'POST',headers:{'content-type':'application/json'},body});
if(r.ok){document.getElementById('status').textContent='✅ Configuración guardada. Reconectando...';setTimeout(poll,3000);}
else{document.getElementById('status').textContent='❌ Error guardando.';}
}
poll();setInterval(poll,3000);
</script>
</body>
</html>
